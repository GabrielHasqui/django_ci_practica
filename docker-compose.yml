# Entorno local de practica: Django + PostgreSQL.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-practica_ci}
      POSTGRES_USER: ${DB_USER:-practica}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en el archivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
