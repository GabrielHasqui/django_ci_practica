name: Django CI

on:
  push:
    branches: ["main", "ci-setup"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas Django con PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: practica_ci
          POSTGRES_USER: practica
          POSTGRES_PASSWORD: practica-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U practica -d practica_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Valores exclusivos de la base temporal de CI.
      DJANGO_SECRET_KEY: django-ci-only-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
      DB_NAME: practica_ci
      DB_USER: practica
      DB_PASSWORD: practica-ci-only
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6

      - name: Configurar Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar configuracion y migraciones
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Ejecutar pruebas
        run: python manage.py test --verbosity 2

      - name: Construir la imagen de Docker
        run: docker build -t django-practica-imagen:latest .

      - name: Guardar la imagen en un archivo .tar
        run: docker save -o imagen-django.tar django-practica-imagen:latest

      - name: Subir imagen como artefacto a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: artefacto-docker
          path: imagen-django.tar
